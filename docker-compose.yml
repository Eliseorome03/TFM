services:
  drools-engine:
    build:
      context: ./drools_docker/drools-app
      dockerfile: Dockerfile
    container_name: drools-engine
    ports:
      - "8080:8080"

  python-api:
    build:
      context: ./python-backend
      dockerfile: Dockerfile
    container_name: python-api
    ports:
      - "8000:8000"
    env_file:
      - ./python-backend/.env
    environment:
      - DROOLS_API_URL=http://drools-engine:8080
    depends_on:
      - drools-engine

