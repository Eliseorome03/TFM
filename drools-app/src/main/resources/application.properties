server.port=8080
spring.application.name=drools-app

# Logging
logging.level.com.example.demo=DEBUG
logging.level.org.drools=WARN
logging.level.org.kie=WARN

# Jackson serialization: use snake_case for JSON field names (aligns with Python backend)
spring.jackson.property-naming-strategy=SNAKE_CASE
# Include null fields so the Python Pydantic models can deserialize cleanly
spring.jackson.default-property-inclusion=always
